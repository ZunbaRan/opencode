name: release openchamber opencode fork

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fork version, for example 1.18.9-oc.1"
        required: true
        type: string
      prerelease:
        description: "Publish as prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: openchamber-opencode-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-version:
    if: github.repository == 'ZunbaRan/opencode'
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.revisions.outputs.upstream }}
      fork: ${{ steps.revisions.outputs.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openchamber-apps
          fetch-depth: 0
      - name: Validate version and resolve revisions
        id: revisions
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-oc\.[0-9]+$ ]]; then
            echo "version must match <upstream-version>-oc.<revision>" >&2
            exit 1
          fi
          upstream_version="$(node -p "require('./packages/opencode/package.json').version")"
          if [[ "${{ inputs.version }}" != "${upstream_version}-oc."* ]]; then
            echo "fork version must extend the checked-out upstream version ${upstream_version}" >&2
            exit 1
          fi
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
          upstream_commit="$(git rev-parse upstream/dev)"
          if ! git merge-base --is-ancestor "$upstream_commit" HEAD; then
            echo "openchamber-apps must merge the latest upstream/dev before release" >&2
            exit 1
          fi
          echo "upstream=$upstream_commit" >> "$GITHUB_OUTPUT"
          echo "fork=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openchamber-apps
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@zunbaran"
      - run: bun install --frozen-lockfile
      - name: Run release gates
        run: |
          bun --cwd packages/opencode typecheck
          bun --cwd packages/opencode test --timeout 20000 --max-concurrency 2
          bun run script/openchamber-compat.ts
          bun --cwd packages/client run check:generated
          bun packages/sdk/js/script/build.ts
          git diff --exit-code -- packages/sdk/js/src/v2/gen
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ inputs.version }}"
          title="OpenCode ${{ inputs.version }} for OpenChamber"
          notes="OpenChamber-managed OpenCode fork. Upstream dev: ${{ needs.validate-version.outputs.upstream }}. Fork: ${{ needs.validate-version.outputs.fork }}."
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --notes "$notes" \
              --prerelease=${{ inputs.prerelease }}
          else
            release_args=(release create "$tag" --repo "${{ github.repository }}" --title "$title" --notes "$notes")
            if [[ "${{ inputs.prerelease }}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi
      - name: Build and upload all CLI platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_RELEASE: "true"
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_DISTRIBUTION: ZunbaRan/opencode
          OPENCODE_UPSTREAM_COMMIT: ${{ needs.validate-version.outputs.upstream }}
          OPENCODE_FORK_COMMIT: ${{ needs.validate-version.outputs.fork }}
        run: bun packages/opencode/script/build.ts
      - name: Generate and publish fork SDK
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          FORK_VERSION: ${{ inputs.version }}
        run: |
          bun packages/sdk/js/script/build.ts
          bun script/openchamber-sdk-package.ts
          npm view "@zunbaran/opencode-sdk@${{ inputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1 || \
            npm publish .openchamber-sdk-package --registry=https://npm.pkg.github.com
          npm pack .openchamber-sdk-package --pack-destination packages/opencode/dist
      - name: Create checksums and provenance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          UPSTREAM_COMMIT: ${{ needs.validate-version.outputs.upstream }}
          FORK_COMMIT: ${{ needs.validate-version.outputs.fork }}
        run: bun run script/openchamber-provenance.ts
      - name: Attest released CLI and SDK artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: packages/opencode/dist/SHA256SUMS
      - name: Upload metadata and SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ inputs.version }}" \
            packages/opencode/dist/SHA256SUMS \
            packages/opencode/dist/openchamber-provenance.json \
            packages/opencode/dist/zunbaran-opencode-sdk-${{ inputs.version }}.tgz \
            --clobber --repo "${{ github.repository }}"
